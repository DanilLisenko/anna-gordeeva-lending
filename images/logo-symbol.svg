<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#533B50"/>
      <stop offset="60%" stop-color="#3B2639"/>
      <stop offset="100%" stop-color="#A66B7D"/>
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A66B7D"/>
      <stop offset="100%" stop-color="#D4A373"/>
    </linearGradient>
  </defs>

  <!-- Ambient background circle -->
  <circle cx="100" cy="100" r="92" fill="#FAF8F5" stroke="#EFE4EB" stroke-width="2"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#A66B7D" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- Lotus & Soul Harmony Lines -->
  <!-- Central Meditating Soul -->
  <circle cx="100" cy="62" r="11" fill="none" stroke="url(#logoGrad)" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Arms & Inner Embrace -->
  <path d="M85 86 C85 75, 115 75, 115 86 C115 102, 85 105, 100 125 C108 115, 122 108, 122 96" 
        fill="none" stroke="url(#logoGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left Lotus Petal -->
  <path d="M100 125 C75 125, 45 105, 52 82 C65 82, 80 95, 90 108" 
        fill="none" stroke="url(#logoGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Right Lotus Petal (Rose Gold Accent) -->
  <path d="M100 125 C125 125, 155 105, 148 82 C135 82, 120 95, 110 108" 
        fill="none" stroke="url(#roseAccent)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Base Petal Cradle -->
  <path d="M52 110 C68 142, 132 142, 148 110" 
        fill="none" stroke="url(#logoGrad)" stroke-width="5" stroke-linecap="round"/>
</svg>
