<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="monBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#533B50"/>
      <stop offset="100%" stop-color="#362234"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#E2B4BD"/>
    </linearGradient>
  </defs>

  <!-- Background rounded box -->
  <rect width="64" height="64" rx="16" fill="url(#monBg)"/>

  <!-- Outer Circle -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#A66B7D" stroke-width="1.8" stroke-opacity="0.7"/>

  <!-- Monogram AG Stylized -->
  <!-- A left leg and peak -->
  <path d="M22 44 C24 38, 29 20, 31 18 C33 22, 35 29, 37 38" 
        fill="none" stroke="#FAF8F5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- A crossbar curving into G -->
  <path d="M24 35 C28 35, 33 24, 38 23 C43 22, 47 26, 46 32 C45 38, 39 44, 33 43 C29 42, 28 38, 31 35 C34 32, 42 34, 45 34" 
        fill="none" stroke="url(#goldAccent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
